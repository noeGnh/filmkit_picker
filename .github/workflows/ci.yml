name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Flutter version the package is developed with (Gradle 9.3.1, AGP 9.1.0, Kotlin 2.4.0).
  FLUTTER_VERSION: 3.47.2

jobs:
  dart:
    name: Analyze and Dart tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/integration_test
      - run: flutter analyze
      - run: flutter analyze
        working-directory: example
      - run: flutter test --coverage

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: gradle/actions/setup-gradle@v5
      - run: flutter build apk --debug
        working-directory: example

  android-integration:
    name: Android integration tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: gradle/actions/setup-gradle@v5
      # Built before the emulator starts, then installed there to give it the photo access
      # (flutter test reinstalls it and keeps the permissions).
      - run: flutter build apk --debug
        working-directory: example
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          working-directory: example
          script: |
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell pm grant dev.noegnh.filmkit_picker_example android.permission.READ_MEDIA_IMAGES
            adb shell pm grant dev.noegnh.filmkit_picker_example android.permission.READ_MEDIA_VIDEO
            flutter test integration_test/picker_test.dart

  ios:
    name: iOS build and integration tests (simulator)
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build ios --simulator --debug
        working-directory: example
      - name: Boot a simulator
        id: simulator
        run: |
          # An iPhone of the runtime matching the active Xcode's SDK: Flutter only lists those.
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "Xcode: $(xcodebuild -version | head -1), simulator SDK $sdk"
          udid=$(xcrun simctl list devices available --json | SDK="$sdk" python3 -c "
          import json, os, sys
          runtime = 'iOS-' + os.environ['SDK'].replace('.', '-')
          devices = json.load(sys.stdin)['devices']
          matches = [d for r, ds in devices.items() if r.endswith(runtime) for d in ds if d['name'].startswith('iPhone')]
          if not matches:
              sys.exit('No iPhone simulator for ' + runtime + ' in ' + ', '.join(devices))
          print(matches[-1]['udid'])
          ")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          # The tests can't answer the photo access prompt.
          xcrun simctl privacy "$udid" grant photos dev.noegnh.filmkitPickerExample
          flutter devices
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # With a watchdog that retries when flutter test misses the app's start
      # (flutter/flutter#181771).
      - name: Integration tests
        timeout-minutes: 45
        run: ../.github/scripts/ios_integration_tests.sh ${{ steps.simulator.outputs.udid }}
        working-directory: example
      - name: Upload the diagnostics of hung attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-diagnostics
          path: example/build/ios_diagnostics
          if-no-files-found: ignore
