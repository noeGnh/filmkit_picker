name: filmkit_picker_example
description: "filmkit_picker example: pick, then edit with filmkit."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  filmkit_picker:
    path: ../
  filmkit:
    git:
      url: https://github.com/noeGnh/filmkit.git
      ref: feat/picker-support
  photo_manager: ^3.12.0
  video_player: ^2.14.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Seeded into the photo library by the integration tests.
  assets:
    - assets/
